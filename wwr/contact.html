<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover our whitewater rafting adventures, explore exciting river trips, and learn how we provide thrilling and safe experiences for individuals and groups.">
    <meta name="author" content="Mitchel Azuonye Sunday">
    <title>Conatact Us — RiverQuest Adventures</title>
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/riverquest.png" alt="Whitewater Rafting Logo" width="100">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="company-info">
            <h1>RiverQuest Adventures</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>
        <section class="contact-grid">
            <div class="map-container">
                <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-119.02%2C36.05%2C-118.98%2C36.08&layer=mapnik&marker=36.065%2C-119.00" title="Company Location Map" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset class="form-row align-top">
                    <legend>Message Purpose</legend>
                    <div class="radio-group">
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>

                <div class="message-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here" required></textarea>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="newsletter" name="newsletter" checked>
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <!-- Employee Profiles -->
        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure class="employee-card">
                    <img src="images/employee1.jpg" alt="Employee Profile 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee2.jpg" alt="Employee Profile 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee3.jpg" alt="Employee Profile 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 &#128166; RiverQuest Adventures &#128166; Mitchel Azuonye Sunday</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/" target="_blank">
                <img src="images/facebook.png" alt="Facebook Icon" width="75">
            </a>
            <a href="https://www.linkedin.com/" target="_blank">
                <img src="images/linkedin.png" alt="LinkedIn Icon" width="75">
            </a>
            <a href="https://www.instagram.com/" target="_blank">
                <img src="images/instagram-logo.png" alt="Instagram Icon" width="75">
            </a>
        </nav>
    </footer>
</body>

</html>
